<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Syntheon Bridge V2 - Outbound Sender Config</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 20px; background: #f8f9fa; color: #333; }
    h2 { font-size: 18px; margin-bottom: 12px; color: #111; }
    .card { background: #fff; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; max-width: 440px; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    input[type="text"] { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    button { background: #007bff; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: 500; }
    button:hover { background: #0056b3; }
    .status { margin-top: 10px; font-size: 12px; color: #28a745; min-height: 16px; }
    .note { font-size: 11px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Syntheon Bridge V2 - Outbound Sender</h2>
    <div class="field">
      <label for="bridgeEndpoint">Endpoint da Bridge Local:</label>
      <input type="text" id="bridgeEndpoint" placeholder="http://127.0.0.1:8765">
      <div class="note">Endpoint HTTP da Bridge V2 local para recepção de envelopes de saída.</div>
    </div>
    <div class="field">
      <label class="checkbox-label">
        <input type="checkbox" id="enabled" checked> Habilitar Transmissão Outbound
      </label>
    </div>
    <button id="saveBtn">Salvar Configurações</button>
    <div class="status" id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
